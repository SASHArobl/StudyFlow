# Local development only. Generated with Supabase CLI, reduced to used services.
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "studyflow"

[api]
enabled = true
port = 54321
# Expose only fixed RPCs; user-owned tables remain private.
schemas = ["api"]
extra_search_path = ["extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/confirm",
  "http://127.0.0.1:3000/auth/confirm",
  "http://localhost:3000/reset-password",
  "http://127.0.0.1:3000/reset-password",
  "http://localhost:3000/auth/confirm?flow=recovery",
  "http://127.0.0.1:3000/auth/confirm?flow=recovery",
  "http://127.0.0.1:3100/auth/confirm",
  "http://127.0.0.1:3100/auth/confirm?flow=recovery",
]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[edge_runtime]
enabled = false

[analytics]
enabled = false

# Local development/test limits; review hosted limits separately before production.
[auth.rate_limit]
email_sent = 200
sign_in_sign_ups = 200
